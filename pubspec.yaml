name: blood_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase Packages
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_messaging: ^14.9.2

  # Image Picker (no storage)
  image_picker: ^1.1.2

  # Maps and Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  location: ^6.0.2

  # For Local Notifications
  flutter_local_notifications: ^17.1.2

  # For nice timestamps
  timeago: ^3.6.1
  url_launcher: ^6.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# ... (rest of the file is unchanged)
flutter:
  uses-material-design: true

  assets:
    - assets/image/
